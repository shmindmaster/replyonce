name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Redis is addressed by IPv4: Memurai on Windows does not listen on ::1, and a refused
# connection there costs about 2 s before the client falls back from localhost's ::1.
env:
  REPLYONCE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
  REPLYONCE_REDIS_URL: redis://127.0.0.1:6379
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
  REDIS_URL: redis://127.0.0.1:6379

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }}, memory + postgres + redis)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backends
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Chaos demo stress loop (every seed, every store, several passes)
        if: matrix.node == 24
        run: npx vitest run test/demo.test.ts
        env:
          REPLYONCE_DEMO_REPEAT: 4
      - run: npm run smoke
      - name: Chaos demo (fails on any duplicate)
        run: node dist/cli.js demo --conversations 300
      - name: Examples
        shell: bash
        run: |
          npx tsx examples/quickstart.ts
          npx tsx examples/agent-loop.ts
          npx tsx examples/webhook-server.ts
          npx tsx examples/postgres.ts
          npx tsx examples/bullmq-worker.ts
      - if: matrix.node == 24 && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            dist
            package.json
          retention-days: 3

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }}, memory + postgres + redis)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.13']
    defaults:
      run:
        working-directory: python
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backends
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
      - name: Chaos demo (fails on any duplicate)
        run: uv run replyonce demo --conversations 200
      - run: uv build
      - name: Wheel installs and runs without dev dependencies
        run: |
          venv="$RUNNER_TEMP/wheel-check"
          uv venv "$venv"
          uv pip install --python "$venv" dist/*.whl
          if [ "$RUNNER_OS" = Windows ]; then bin="$venv/Scripts"; else bin="$venv/bin"; fi
          "$bin/replyonce" demo --conversations 30

  interop:
    name: typescript and python share one store (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backends
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --project python
      - name: TS writes, Python replays and supersedes, TS observes
        run: |
          SCOPE="interop-${GITHUB_RUN_ID}-${RUNNER_OS}"
          npx tsx scripts/interop.ts 1 "$SCOPE"
          uv run --project python python python/scripts/interop.py "$SCOPE"
          npx tsx scripts/interop.ts 3 "$SCOPE"

  compat:
    name: built package on node ${{ matrix.node }} (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run smoke
      - run: node dist/cli.js demo --conversations 100
