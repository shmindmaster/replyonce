name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }}, memory + postgres + redis)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      REPLYONCE_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      REPLYONCE_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - name: Chaos demo (fails on any duplicate)
        run: node dist/cli.js demo --conversations 300
      - name: Examples
        run: |
          npx tsx examples/quickstart.ts
          npx tsx examples/agent-loop.ts
          npx tsx examples/webhook-server.ts
          npx tsx examples/postgres.ts
          npx tsx examples/bullmq-worker.ts
      - if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            dist
            package.json
          retention-days: 3

  compat:
    name: built package on node ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run smoke
      - run: node dist/cli.js demo --conversations 100
