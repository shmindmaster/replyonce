[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "replyonce"
version = "0.1.2"
description = "Stop your agent from replying, refunding or ticketing twice. Idempotency keys, per-conversation write fencing and an effect ledger for tool-calling agents, webhooks and workers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sarosh Hussain" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["idempotency", "exactly-once", "ai-agents", "llm", "tool-calling", "webhooks", "fencing-token", "postgres", "redis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
redis = ["redis>=5.0"]

[project.urls]
Homepage = "https://github.com/shmindmaster/replyonce"
Source = "https://github.com/shmindmaster/replyonce/tree/main/python"
Issues = "https://github.com/shmindmaster/replyonce/issues"

[project.scripts]
replyonce = "replyonce.cli:main"

[dependency-groups]
dev = ["pytest>=8", "psycopg[binary]>=3.1", "psycopg-pool>=3.2", "redis>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/replyonce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
